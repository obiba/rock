name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Deploy Release creates the GitHub release and uploads its assets
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm devscripts fakeroot debhelper build-essential

      - name: Cache Maven and general cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2
            ~/.cache
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up Maven settings
        run: |
          mkdir -p ~/.m2
          cp .settings.xml ~/.m2/settings.xml

      - name: Deploy Release
        run: mvn -B -Prelease deploy
        env:
          GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACTORY_USER: ${{ secrets.ARTIFACTORY_USER }}
          ARTIFACTORY_PWD: ${{ secrets.ARTIFACTORY_PWD }}

      - name: Upload RPM and DEB packages to Artifactory
        run: |
          version=${GITHUB_REF_NAME}
          curl -fsS -u "${ARTIFACTORY_USER}:${ARTIFACTORY_PWD}" -XPUT https://obiba.jfrog.io/artifactory/rpm-local/ \
            -T target/rpm/rock/RPMS/noarch/rock-${version}-1.noarch.rpm
          curl -fsS -u "${ARTIFACTORY_USER}:${ARTIFACTORY_PWD}" -XPUT \
            "https://obiba.jfrog.io/artifactory/debian-local/pool/rock_${version}_all.deb;deb.distribution=all;deb.component=main;deb.architecture=all" \
            -T target/rock_${version}_all.deb
        env:
          ARTIFACTORY_USER: ${{ secrets.ARTIFACTORY_USER }}
          ARTIFACTORY_PWD: ${{ secrets.ARTIFACTORY_PWD }}

  # Native binaries for the Docker image. Runners match the rocker/r-ver base image
  # (Ubuntu 24.04) so the binary does not need a newer glibc than the image has.
  native-release:
    needs: release
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          cache: 'maven'

      - name: Set up Maven settings
        run: |
          mkdir -p ~/.m2
          cp .settings.xml ~/.m2/settings.xml

      - name: Build native binary
        run: mvn -B -Pnative -DskipTests package org.graalvm.buildtools:native-maven-plugin:compile-no-fork
        env:
          ARTIFACTORY_USER: ${{ secrets.ARTIFACTORY_USER }}
          ARTIFACTORY_PWD: ${{ secrets.ARTIFACTORY_PWD }}

      - name: Upload to GitHub release
        run: |
          mv target/rock rock-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}
          gh release upload "$GITHUB_REF_NAME" rock-${GITHUB_REF_NAME}-linux-${{ matrix.arch }} --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
