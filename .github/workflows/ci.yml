name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - '*'
  pull_request:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java-version: [21]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm devscripts fakeroot debhelper build-essential

      - name: Cache Maven and general cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2
            ~/.cache
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up Maven settings
        run: |
          mkdir -p ~/.m2
          cp .settings.xml ~/.m2/settings.xml

      - name: Deploy Snapshot
        if: github.ref == 'refs/heads/snapshot' && github.event_name == 'push'
        run: mvn -U -B deploy
        env:
          GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACTORY_USER: ${{ secrets.ARTIFACTORY_USER }}
          ARTIFACTORY_PWD: ${{ secrets.ARTIFACTORY_PWD }}

      - name: Deploy Release
        if: startsWith(github.ref, 'refs/tags/')
        run: mvn -B -Prelease deploy
        env:
          GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACTORY_USER: ${{ secrets.ARTIFACTORY_USER }}
          ARTIFACTORY_PWD: ${{ secrets.ARTIFACTORY_PWD }}

      - name: Maven Install (non-snapshot, non-tag)
        if: github.ref != 'refs/heads/snapshot' && !startsWith(github.ref, 'refs/tags/')
        run: mvn -U -B install

  # Native binaries for the Docker image. Runners match the rocker/r-ver base image
  # (Ubuntu 24.04) so the binary does not need a newer glibc than the image has.
  native-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-and-deploy
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          cache: 'maven'

      - name: Set up Maven settings
        run: |
          mkdir -p ~/.m2
          cp .settings.xml ~/.m2/settings.xml

      - name: Build native binary
        run: mvn -B -Pnative -DskipTests package org.graalvm.buildtools:native-maven-plugin:compile-no-fork
        env:
          ARTIFACTORY_USER: ${{ secrets.ARTIFACTORY_USER }}
          ARTIFACTORY_PWD: ${{ secrets.ARTIFACTORY_PWD }}

      - name: Upload to GitHub release
        run: |
          mv target/rock rock-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}
          gh release upload "$GITHUB_REF_NAME" rock-${GITHUB_REF_NAME}-linux-${{ matrix.arch }} --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
